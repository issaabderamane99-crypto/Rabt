<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none" font-family="Plus Jakarta Sans, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0E3B43" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="520" height="400" rx="24" fill="#FFF6E3"/>
  <g stroke="#F3E2BC" stroke-width="1">
    <path d="M0 100 H520 M0 200 H520 M0 300 H520 M130 0 V400 M260 0 V400 M390 0 V400"/>
  </g>

  <!-- routes -->
  <g stroke="#0E3B43" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round">
    <path d="M110 110 C 180 110, 200 200, 260 200"/>
    <path d="M260 200 C 330 200, 340 110, 410 110"/>
    <path d="M260 200 C 320 220, 350 300, 410 300"/>
    <path d="M110 300 C 170 300, 210 220, 260 200"/>
  </g>

  <!-- supplier / factory -->
  <g filter="url(#sh)"><rect x="60" y="66" width="100" height="88" rx="16" fill="#fff"/></g>
  <path d="M82 132 V104 L100 114 V104 L118 114 V96 H138 V132 Z" fill="#0E3B43"/>
  <rect x="124" y="84" width="8" height="14" fill="#0E3B43"/>
  <text x="110" y="148" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Supplier</text>

  <!-- second supplier -->
  <g filter="url(#sh)"><rect x="60" y="256" width="100" height="88" rx="16" fill="#fff"/></g>
  <rect x="88" y="280" width="44" height="34" rx="4" fill="#F2B544"/>
  <path d="M88 292 H132 M110 280 V314" stroke="#fff" stroke-width="3"/>
  <text x="110" y="336" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Vendor</text>

  <!-- hub / platform -->
  <g filter="url(#sh)"><circle cx="260" cy="200" r="58" fill="#0E3B43"/></g>
  <circle cx="260" cy="200" r="44" stroke="#2BB3A3" stroke-width="3" stroke-dasharray="4 6"/>
  <path d="M244 210 L256 198 M264 190 L276 178" stroke="#F2B544" stroke-width="5" stroke-linecap="round"/>
  <circle cx="242" cy="212" r="8" fill="#fff"/>
  <circle cx="278" cy="176" r="8" fill="#2BB3A3"/>
  <text x="260" y="246" font-size="11" font-weight="700" fill="#9CC9C3" text-anchor="middle">Rabt</text>

  <!-- warehouse -->
  <g filter="url(#sh)"><rect x="360" y="66" width="100" height="88" rx="16" fill="#fff"/></g>
  <path d="M382 132 V104 L410 88 L438 104 V132 Z" fill="#2BB3A3"/>
  <rect x="398" y="112" width="24" height="20" fill="#fff"/>
  <path d="M398 119 H422 M398 126 H422" stroke="#2BB3A3" stroke-width="2"/>
  <text x="410" y="148" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Warehouse</text>

  <!-- truck / customer -->
  <g filter="url(#sh)"><rect x="360" y="256" width="100" height="88" rx="16" fill="#fff"/></g>
  <rect x="376" y="284" width="44" height="26" rx="4" fill="#0E3B43"/>
  <path d="M420 292 H434 L444 302 V310 H420 Z" fill="#2BB3A3"/>
  <circle cx="388" cy="314" r="6" fill="#F2B544" stroke="#fff" stroke-width="2"/>
  <circle cx="432" cy="314" r="6" fill="#F2B544" stroke="#fff" stroke-width="2"/>
  <text x="410" y="336" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Delivery</text>

  <!-- status chip -->
  <g filter="url(#sh)"><rect x="168" y="22" width="184" height="36" rx="18" fill="#fff"/></g>
  <circle cx="190" cy="40" r="6" fill="#2BB3A3"/>
  <text x="204" y="45" font-size="12" font-weight="700" fill="#0B2A30">PO #2041 · In transit</text>
</svg>
