<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none" font-family="Plus Jakarta Sans, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Rabt for mosques and organizations</title>
  <desc id="desc">An illustrative concept connecting mosques, organizations, donors, and donations and zakat through Rabt.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0E3B43" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="520" height="400" rx="24" fill="#FFF6E3"/>
  <path d="M0 100H520M0 200H520M0 300H520M130 0V400M260 0V400M390 0V400" stroke="#F3E2BC"/>

  <g stroke="#0E3B43" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round">
    <path d="M110 124C178 124 202 210 260 210"/>
    <path d="M260 210C322 210 342 124 410 124"/>
    <path d="M110 306C180 306 204 230 260 210"/>
    <path d="M260 210C320 230 340 306 410 306"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="44" y="76" width="132" height="96" rx="16" fill="#FFF"/>
    <rect x="344" y="76" width="132" height="96" rx="16" fill="#FFF"/>
    <rect x="44" y="260" width="132" height="96" rx="16" fill="#FFF"/>
    <rect x="344" y="260" width="132" height="96" rx="16" fill="#FFF"/>
  </g>

  <!-- Mosque: dome, doorway, and two minarets. -->
  <path d="M90 139V119H130V139Z" fill="#0E3B43"/>
  <path d="M94 119C94 107 106 105 110 97C114 105 126 107 126 119Z" fill="#2BB3A3"/>
  <path d="M105 139V130A5 5 0 0 1 115 130V139Z" fill="#FFF"/>
  <path d="M81 139V111H87V139M133 139V111H139V139" fill="#0E3B43"/>
  <path d="M80 111L84 102L88 111M132 111L136 102L140 111" fill="#2BB3A3"/>
  <text x="110" y="159" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Mosques</text>

  <!-- Community organization building and a heart. -->
  <path d="M380 139V109L410 94L440 109V139Z" fill="#2BB3A3"/>
  <rect x="389" y="113" width="42" height="26" rx="3" fill="#FFF"/>
  <path d="M410 132L400 123C394 116 403 110 410 117C417 110 426 116 420 123Z" fill="#0E3B43"/>
  <text x="410" y="159" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Organizations</text>

  <!-- Donors and community members. -->
  <circle cx="110" cy="285" r="9" fill="#0E3B43"/>
  <circle cx="89" cy="291" r="7" fill="#2BB3A3"/>
  <circle cx="131" cy="291" r="7" fill="#2BB3A3"/>
  <path d="M94 320V313A16 16 0 0 1 126 313V320Z" fill="#0E3B43"/>
  <path d="M76 320V312A13 13 0 0 1 95 301L89 320ZM131 320L125 301A13 13 0 0 1 144 312V320Z" fill="#2BB3A3"/>
  <text x="110" y="342" font-size="11" font-weight="700" fill="#4A6268" text-anchor="middle">Donors</text>

  <!-- Giving: heart above an open hand. -->
  <path d="M410 308L394 294C384 283 400 272 410 284C420 272 436 283 426 294Z" fill="#F2B544"/>
  <path d="M382 313H394L402 317H422C429 317 430 324 422 327H399L384 321H378" stroke="#0E3B43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="410" y="342" font-size="10.5" font-weight="700" fill="#4A6268" text-anchor="middle">Donations &amp; zakat</text>

  <!-- Rabt platform hub, matching the site's other diagrams. -->
  <g filter="url(#shadow)"><circle cx="260" cy="210" r="58" fill="#0E3B43"/></g>
  <circle cx="260" cy="210" r="44" stroke="#2BB3A3" stroke-width="3" stroke-dasharray="4 6"/>
  <path d="M244 220L256 208M264 200L276 188" stroke="#F2B544" stroke-width="5" stroke-linecap="round"/>
  <circle cx="242" cy="222" r="8" fill="#FFF"/>
  <circle cx="278" cy="186" r="8" fill="#2BB3A3"/>
  <text x="260" y="251" font-size="11" font-weight="700" fill="#9CC9C3" text-anchor="middle">Rabt</text>

  <g filter="url(#shadow)"><rect x="148" y="22" width="224" height="36" rx="18" fill="#FFF"/></g>
  <circle cx="168" cy="40" r="6" fill="#2BB3A3"/>
  <text x="183" y="44" font-size="11" font-weight="700" fill="#0B2A30">Giving · Community · Impact</text>
